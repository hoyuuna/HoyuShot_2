name: Build & Release HoyuShot

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Custom version (e.g. 0.0.25)'
        required: false
        default: ''
      target_commit:
        description: 'Target commit hash (e.g. 0c13825)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.target_commit != '' && inputs.target_commit || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          VERSION="${{ inputs.custom_version }}"
          if [ -z "$VERSION" ]; then
            OFFSET=46
            BUILD_INDEX=$(( ${{ github.run_number }} - OFFSET ))
            if [ $BUILD_INDEX -lt 0 ]; then BUILD_INDEX=0; fi
            VERSION="1.0.${BUILD_INDEX}"
            VERSION_CODE="${{ github.run_number }}"
          else
            VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $NF}')
          fi
          ./gradlew assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION \
            --no-daemon --stacktrace

      - name: Prepare Release APK Asset & Changelog
        id: prepare_asset
        run: |
          VERSION="${{ inputs.custom_version }}"
          if [ -z "$VERSION" ]; then
            OFFSET=46
            BUILD_INDEX=$(( ${{ github.run_number }} - OFFSET ))
            if [ $BUILD_INDEX -lt 0 ]; then BUILD_INDEX=0; fi
            VERSION="1.0.${BUILD_INDEX}"
          fi
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          TARGET_NAME="HoyuShot-v${VERSION}.apk"
          cp "$APK_SRC" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          COMMIT_MSG=$(git log -1 --pretty=%B)

          echo "**Changelog:**" > release_notes.md
          echo "$COMMIT_MSG" >> release_notes.md
          echo "" >> release_notes.md
          echo "| File | Platform |" >> release_notes.md
          echo "| :--- | :--- |" >> release_notes.md
          echo "| \`$TARGET_NAME\` | Android (Universal: ARM64, ARMv7, x86, x86_64 - Android 8.0+) |" >> release_notes.md

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.prepare_asset.outputs.version }}"
          name: "HoyuShot v${{ steps.prepare_asset.outputs.version }}"
          body_path: release_notes.md
          prerelease: true
          files: ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
